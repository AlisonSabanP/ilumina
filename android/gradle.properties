org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 usa por defecto el nuevo DSL; el plugin de Flutter todavía aplica el DSL
# antiguo, así que se opta explícitamente por el DSL clásico. Además, varios
# plugins de AR (`arcore_flutter_plugin`) siguen sobre AGP 7/8 y no compilan con
# el DSL nuevo.
android.newDsl=false
# Los plugins de AR publican sus dependencias en el repositorio Maven de Google.
android.enableJetifier=false
# Sceneform 1.17.1 publica dos artefactos distintos (`sceneform:core` y
# `sceneform:sceneform-base`) que declaran el mismo `package` en su manifiesto.
# AGP 9 aborta por "namespace duplicado"; esta bandera restaura el comportamiento
# tolerante anterior, necesario para que `arcore_flutter_plugin` compile.
android.uniquePackageNames=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
