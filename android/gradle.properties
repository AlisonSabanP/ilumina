org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 usa por defecto el nuevo DSL; el plugin de Flutter todavía aplica el DSL
# antiguo, así que se opta explícitamente por el DSL clásico.
android.newDsl=false
android.enableJetifier=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Compilación incremental de Kotlin desactivada -------------------------
# Síntoma si se quita: en Windows, con el pub-cache en una unidad distinta a la
# del proyecto (por ejemplo D: para el pub-cache y C: para el proyecto), Kotlin
# falla al cerrar sus cachés incrementales con:
#
#   java.lang.IllegalArgumentException: this and base files have different
#   roots: D:\.pub-cache\...\Messages.kt and C:\...\android
#
# La causa: `RelocatableFileToPathConverter` guarda las rutas de los ficheros
# relativas a la raíz del proyecto. Si origen y destino están en discos
# distintos no existe ruta relativa posible, y la escritura del caché aborta.
# Desactivar la compilación incremental de Kotlin evita ese cálculo. El coste
# es que los builds incrementales son más lentos, no que el APK sea distinto.
#
# Alternativa si quieres conservar la compilación incremental: mueve el
# pub-cache a la misma unidad que el proyecto (ver README).
kotlin.incremental=false
