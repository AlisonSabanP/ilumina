# El código de este fork es el original de `arcore_flutter_plugin` 0.1.0, sin
# cambios de comportamiento: solo se ha actualizado su configuración de
# compilación. Se relajan los avisos de estilo para no ensuciar el análisis de
# Lumina con lints de código ajeno que no se va a modificar.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    use_super_parameters: false
    prefer_const_constructors: false
    unnecessary_null_comparison: false

analyzer:
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unnecessary_null_comparison: ignore
