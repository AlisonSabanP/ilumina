name: lumina
description: "Lumina — impresión 3D accesible para todos (motriz, visual, cognitiva) y para profesionales de la salud y ortopedia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Gestión de estado ---
  provider: ^6.1.2
  # `nested` aporta `SingleChildWidget`, el tipo de la lista de `MultiProvider`.
  # Lo usa `provider` internamente; se declara para poder anotar la lista.
  nested: ^1.0.0

  # --- Persistencia local ---
  shared_preferences: ^2.3.0

  # --- Red (Meshy AI REST) y utilidades ---
  http: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  flutter_dotenv: ^6.0.0

  # --- Cámara (usada por la captura de manos) ---
  camera: ^0.12.1

  # --- Accesibilidad ---
  # Panel no invasivo de preferencias WCAG (contraste, tipografía, espaciados...).
  accessibility_widget: ^0.0.2
  # Conversión texto -> Braille Unicode + widget interactivo con feedback háptico.
  braille_text: ^0.0.1

  # --- Visión por computadora / Medición ---
  # 21 landmarks 3D de la mano vía MediaPipe. SOLO Android.
  # (La medición de objetos por AR se retiró: ver la nota en
  # `lib/features/medicion/modelos/measurement_models.dart`.)
  hand_landmarker: ^3.1.0

  # La generación 3D por defecto no necesita ningún paquete: la hace
  # `lib/shared/servicios/stl_builder.dart` (STL y GLB propios). Meshy AI se
  # usa solo si el usuario aporta su clave, a través de `http`.

  # --- Visor 3D (Babylon.js sobre WebView) ---
  power3d: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # `power3d` -> `flutter_inappwebview` -> `flutter_inappwebview_android` 1.1.3,
  # cuya configuración de release usa `proguard-android.txt`; Gradle 9 rechaza
  # ese fichero porque desactiva R8. El fork solo cambia esa línea por
  # `proguard-android-optimize.txt`. Ver el CHANGELOG del paquete.
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

flutter:
  uses-material-design: true

  # `.env` se empaqueta como asset porque `flutter_dotenv` lo lee del bundle en
  # el dispositivo (no del sistema de ficheros). El fichero versionado solo
  # contiene el valor centinela de Meshy (no es una clave válida); la clave real
  # se inyecta con `--dart-define=MESHY_API_KEY=...`, que tiene prioridad.
  # Ver `lib/core/env.dart`.
  assets:
    - assets/images/
    - assets/models/
    - assets/fonts/
    - .env

  fonts:
    # Andika: tipografía diseñada para lectores con dislexia (SIL Open Font License).
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700

    # DejaVu Sans cubre los 256 caracteres del bloque Braille Unicode
    # (U+2800–U+28FF). Se registra con el nombre de familia `Braille` porque es
    # el que usa el paquete `braille_text` en su widget `BrailleText`: el
    # paquete pide esa familia pero no empaqueta ninguna fuente, así que sin
    # esta declaración el Braille se dibuja como cuadros vacíos.
    # Licencia Bitstream Vera / DejaVu, de uso libre.
    - family: Braille
      fonts:
        - asset: assets/fonts/BraillePoints.ttf
